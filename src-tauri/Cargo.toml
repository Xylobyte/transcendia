[package]
name = "transcendia"
version = "1.0.0-beta.2"
description = "An app to translate in realtime a section of your screen"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "transcendia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["macos-private-api", "tray-icon", "unstable"], default-features = false }
tauri-plugin-process = "2.3"
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcap = "0.7"
image = { version = "0.25", default-features = false }
reqwest = { version = "0.12", features = ["blocking", "default-tls"], default-features = false }
env_logger = "0.11"
log = "0.4"
imageproc = "0.25"
rust-paddle-ocr = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", tag = "v1.4.2" }
regex = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2.3.0"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-vision = { version = "0.3.2", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true
panic = "unwind"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
