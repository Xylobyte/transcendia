[package]
name = "transcendia"
version = "1.0.0-beta.2"
description = "An app to translate in realtime a section of your screen"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0"

[dependencies]
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = { version = "0.37", features = ["winit"] }
tray-icon = "0.27"
global-hotkey = "0.10"
directories = "6.0"
single-instance = "0.3"
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
log = "0.4"
ocr-rs = "2.4"
regex = "1.13"
ct2rs-sys = "0.11"
tokenizers = "0.23"
open = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.11", package = "ct2rs-platform" }
raw-window-handle = "0.6"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGWindow"] }
objc2-vision = { version = "0.3", default-features = false }

[target.'cfg(all(target_os = "windows", not(target_arch = "aarch64")))'.dependencies]
ct2rs = { version = "0.11", package = "ct2rs-platform" }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
ct2rs = { version = "0.11" }

[profile.dev]
incremental = true
panic = "unwind"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "Transcendia"
identifier = "com.xylobyte.transcendia"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"]
resources = [{ src = "models", target = "models" }]
formats = ["app", "dmg"]
before-packaging-command = "cargo build --release"
out-dir = "dist"

[package.metadata.packager.macos]
info-plist-path = "Info.plist"
